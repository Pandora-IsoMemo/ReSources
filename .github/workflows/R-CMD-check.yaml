# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # We only test only a subset of os & r combination for non CRAN packages

          # We can't test on mac-os, because Docker in Mac images aren't 
          # available due to licensing issues
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # - {os: ubuntu-latest,   r: 'oldrel-2'} # too old for some recent packages

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: |
            Pandora = https://Pandora-IsoMemo.github.io/drat/

      # Add the dated PPM snapshot only on Linux.
      - name: Configure Linux PPM snapshot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'options(repos = c(
            PPM = "https://packagemanager.posit.co/cran/__linux__/noble/2025-03-01",
            getOption("repos")
          ))' >> ~/.Rprofile

      - name: Show R version
        run: |
          echo "Matrix R selector: ${{ matrix.config.r }}"
          Rscript -e 'cat("Resolved R version:", R.version.string, "\n")'
          Rscript -e 'cat("Repositories:\n"); print(getOption("repos"))'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: true
          cache-version: 2

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
